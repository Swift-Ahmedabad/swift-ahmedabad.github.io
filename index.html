<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swift Ahmedabad</title>
    <meta name="description" content="The official community for Swift developers in Ahmedabad. Join us for meetups, workshops, and networking.">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Sticky Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-content">
            <div class="navbar-logo">
                <img id="navbar-logo-img" src="" alt="Logo">
            </div>
            <a id="contact-btn" href="" class="contact-button">Contact Us</a>
        </div>
    </nav>

    <div class="container">
        <header class="bento-item header">
            <div class="logo">
                <img id="community-logo" src="" alt="Community Logo" class="swift-logo">
            </div>
            <h1 id="community-name"></h1>
            <p id="community-tagline"></p>
        </header>

        <main class="bento-grid" id="links-container">
            <!-- Links will be dynamically loaded from links.json -->
        </main>

        <footer class="bento-item footer">
            <p>© 2026 Swift Ahmedabad. All rights reserved.</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
